name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & Validate Skill
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Prüft das eingecheckte Archiv gegen die Quelldateien, bevor
      # der Build es überschreibt. Schlägt fehl, wenn jemand eine
      # Referenz geändert, aber build-skill.sh nicht ausgeführt hat.
      # Der Linter auf die Skripte, die die Gates unten fahren. Bis hierher
      # entschied `validate-skill.py` ueber rot oder gruen, ohne selbst durch
      # ein Gate zu gehen — ein Pruefskript ohne eigene Pruefung.
      #
      # Ruff exakt gepinnt, nicht mit Obergrenze: fuer `ruff check` genuegte
      # eine, weil der Regelsatz in `select` steht, fuer `ruff format --check`
      # nicht — dort ist das Ergebnis selbst das Kriterium, und jede Version,
      # die am Formatter dreht, faerbt unberuehrten Code rot. 0.16.1 ist die
      # Portfolio-Version.
      - name: Ruff installieren
        run: pip install "ruff==0.16.1"

      - name: Lint
        run: ruff check scripts/

      # Zweites, eigenstaendiges Gate. Ein gruenes `ruff check` belegt kein
      # gruenes Format — die beiden pruefen Verschiedenes. Eigener Schritt,
      # damit im Log steht, welches der beiden ausgeloest hat.
      - name: Format
        run: ruff format --check scripts/

      - name: Validate committed skill archive
        run: python3 scripts/validate-skill.py

      - name: Build skill package
        run: ./scripts/build-skill.sh

      # Nach dem Build muss der Arbeitsbaum sauber sein. Ist er es nicht,
      # war das eingecheckte Archiv nicht reproduzierbar.
      - name: Verify build is reproducible
        run: |
          if ! git diff --quiet -- raspberry-pi-ai.skill; then
            echo "::error::Der Build erzeugt ein anderes Archiv als das eingecheckte."
            echo "Bitte './scripts/build-skill.sh' ausführen und das Ergebnis committen."
            git diff --stat -- raspberry-pi-ai.skill
            exit 1
          fi
          echo "Archiv ist reproduzierbar."

      - name: Upload skill artifact
        uses: actions/upload-artifact@v4
        with:
          name: raspberry-pi-ai-skill
          path: raspberry-pi-ai.skill
          if-no-files-found: error

  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run shellcheck
        run: shellcheck scripts/*.sh
