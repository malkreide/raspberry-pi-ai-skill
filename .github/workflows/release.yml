name: Release

# Veröffentlicht die gebaute raspberry-pi-ai.skill als Release-Asset. Damit
# funktioniert der Download-Link aus dem README
# (releases/latest/download/raspberry-pi-ai.skill).
#
# Zwei Wege führen hierher:
#
#   1. Tag pushen – der Workflow legt das Release an:
#        git tag v1.1.0 && git push origin v1.1.0
#
#   2. Release über die GitHub-Oberfläche anlegen ("Create new tag on publish").
#      Dabei existiert das Release bereits, wenn der Workflow startet – er hängt
#      dann nur noch das Asset an.
#
# Für ein Tag, dessen Lauf fehlgeschlagen ist oder das älter als dieser
# Workflow ist, lässt sich der Job manuell nachziehen:
#   Actions → Release → Run workflow → Tag eintragen

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Bestehendes Tag, das veröffentlicht werden soll (z.B. v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Dieselben Prüfungen wie in ci.yml. Ein Release darf nie aus einem
      # Stand entstehen, der die Validierung nicht besteht.
      - name: Validate committed skill archive
        run: python3 scripts/validate-skill.py

      - name: Build skill package
        run: ./scripts/build-skill.sh

      - name: Verify build is reproducible
        run: |
          if ! git diff --quiet -- raspberry-pi-ai.skill; then
            echo "::error::${RELEASE_TAG} zeigt auf einen Stand, dessen eingechecktes Archiv nicht zu den Quellen passt."
            echo "Bitte './scripts/build-skill.sh' ausführen, committen und neu taggen."
            exit 1
          fi
          echo "Archiv ist reproduzierbar."

      # Das Tag muss auf einem Commit liegen, der in main enthalten ist.
      # Verhindert, dass ein ungeprüfter Feature-Branch als "latest" erscheint.
      # Bezugspunkt ist der ausgecheckte HEAD, nicht GITHUB_SHA – bei einem
      # manuellen Lauf zeigt GITHUB_SHA auf den Branch, nicht auf das Tag.
      - name: Verify tag is on main
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          head_sha=$(git rev-parse HEAD)
          if ! git merge-base --is-ancestor "$head_sha" refs/remotes/origin/main; then
            echo "::error::${RELEASE_TAG} zeigt auf ${head_sha}, das nicht in main enthalten ist."
            exit 1
          fi
          echo "${RELEASE_TAG} liegt auf main."

      # Idempotent: Wurde das Release über die GitHub-Oberfläche angelegt,
      # existiert es beim Start des Workflows bereits. Dann nur das Asset
      # anhängen und vorhandene Metadaten (Titel, Notes) unangetastet lassen.
      - name: Publish release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            echo "Release $RELEASE_TAG existiert bereits – hänge das Asset an."
            gh release upload "$RELEASE_TAG" raspberry-pi-ai.skill --clobber
          else
            echo "Lege Release $RELEASE_TAG an."
            gh release create "$RELEASE_TAG" \
              raspberry-pi-ai.skill \
              --title "$RELEASE_TAG" \
              --generate-notes \
              --verify-tag
          fi

          echo "Assets des Releases:"
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name'
